<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A Birthday Surprise 💗</title>
<style>
body{margin:0;background:#fff5f8;font-family:Arial,sans-serif;text-align:center;color:#6b2948}
.card{max-width:760px;margin:30px auto;padding:24px;background:#fff;border-radius:28px;box-shadow:0 8px 30px #e8bfd0}
img{max-width:100%;border-radius:20px}
h1{font-size:34px;margin:10px}
p{font-size:19px}
button{border:0;border-radius:999px;padding:15px 26px;font-size:18px;background:#e9a8c0;color:#fff;cursor:pointer}
#surprise{display:none}
.hearts{font-size:28px;letter-spacing:8px}
</style>
</head>
<body>
<div class="card">
<div class="hearts">💕 🎀 💕</div>
<h1>Happy Birthday, Dear Sister! 🎂</h1>
<p>Tap below to open your little birthday surprise ✨</p>
<button onclick="openSurprise()">Open Birthday Surprise 💗</button>
<div id="surprise">
<p>🎶 A special song just for you 🎶</p>
<audio id="song" controls>
<source src="birthday-song.mp3" type="audio/mpeg">
</audio>
<br><br>
<img src="birthday-banner.png" alt="Happy Birthday banner">
<p>May your day be filled with love, laughter and beautiful memories! 💕</p>
</div>
</div>
<script>
function openSurprise(){
 document.getElementById('surprise').style.display='block';
 const a=document.getElementById('song');
 a.play().catch(()=>{});
 window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
}
</script>
</body>
</html>
